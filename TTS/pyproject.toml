[project]
name = "tts"
version = "0.1.0"
description = "Standalone TTS microservice using ElevenLabs, MongoDB, and pacat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "motor>=3.3.0",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.1",
]

[project.scripts]
tts = "src.tts.main:main_sync"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]
