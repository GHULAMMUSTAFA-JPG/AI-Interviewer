# Redis configuration for AI Interviewer
# Used by: all services via REDIS_URL=redis://redis:6379/0
#
# Key namespaces in use:
#   tts:{interview_id}:interrupt_signal   — Meeting-Bot → TTS: onspeechstart detected
#   tts:{interview_id}:interrupt_confirm  — Meeting-Bot → TTS: real speech confirmed (stop audio)
#   tts:{interview_id}:interrupt_cancel   — TTS → Meeting-Bot: noise, resume seamlessly
#   tts:{interview_id}:status_events      — TTS → echo guard: speaking / idle pub/sub
#   tts:{interview_id}:status             — TTS status hash (hget "status")
#   speech:{interview_id}:buffer          — STT speech accumulation buffer
#   agent:{interview_id}:status           — Main-Agent pipeline status hash
#   circuit_breaker:{id}:status           — Main-Agent circuit breaker open/closed flag
#   interview:{interview_id}:state        — Phase, turn_count, status hash (UI SSE)

# ─── Persistence ────────────────────────────────────────────────────────────
# Append-only file ensures no data loss on crash/restart.
appendonly yes
appendfsync everysec

# ─── Memory ─────────────────────────────────────────────────────────────────
maxmemory 256mb
# allkeys-lru: evict least-recently-used keys when memory limit is reached.
# Safe for this workload — all Redis keys are derived from MongoDB (source of truth).
maxmemory-policy allkeys-lru

# ─── Pub/Sub ─────────────────────────────────────────────────────────────────
# No subscriber limit needed — each interview spawns at most 3-4 subscribers.
# Timeout of 0 = subscribed clients never time out.
timeout 0

# ─── Keyspace notifications (optional, for debugging) ────────────────────────
# Uncomment to receive events when interrupt keys are set/expired.
# notify-keyspace-events "KEA"

# ─── Logging ────────────────────────────────────────────────────────────────
loglevel notice
logfile ""

# ─── Authentication ──────────────────────────────────────────────────────────
# Password auth is enabled. All services connect via REDIS_URI in .env.docker.
# Change this password AND update REDIS_URI in .env.docker before exposing to
# a public network.
requirepass changeme_redis

# ─── Network ────────────────────────────────────────────────────────────────
bind 0.0.0.0
protected-mode no
