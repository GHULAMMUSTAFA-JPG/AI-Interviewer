global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # Add alertmanager:9093 when alert routing is configured

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "interview-agent"
    static_configs:
      - targets: ["interview-agent:9001"]
    metrics_path: /metrics

  # tts service removed — audio is handled per-interview by tts_listener.py inside
  # each bot container. Add a scrape target here if a metrics endpoint is added there.
