# ══════════════════════════════════════════════════════════════════════
# AI Interviewer — Root Compose File
#
# Starts all services from one place:
#   docker compose up --build
#
# First run only — seed interview data (after containers are up):
#   docker compose exec interview-agent python setup_db.py
#
# Secrets: copy .env.example → .env and fill in your keys before running.
#
# Flow:
#   UI form → interviews.interviews (insert)
#     ├── interview-agent (greeting watcher) → interviews.transcripts {speaker=agent}
#     │     └── tts → ElevenLabs → PulseAudio → Chrome (plays in meeting)
#     └── meeting-bot → Chrome joins meeting
#           └── caption scraper → interviews.transcripts {speaker=candidate}
#                 └── interview-agent (candidate watcher) → LLM → transcripts {speaker=agent}
#                       └── tts → plays response → loop
# ══════════════════════════════════════════════════════════════════════

services:


  # ─────────────────────────────────────────────────────────────────────────────
  # Redis 7 — Real-time state management, pub/sub, caching, and queues.
  # Used for:
  #   - Bot & meeting state management (instant status updates)
  #   - Pub/sub events (real-time notifications)
  #   - Caching (reduce MongoDB load)
  #   - Task queues (TTS, STT jobs)
  #   - Heartbeat monitoring (detect dead bots)
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      - TZ=Asia/Karachi
    ports:
      - "6379:6379"       # EXPOSED - Connect Redis CLI to localhost:6379
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - interview-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # ────────────────────────────────────────────────────────────────
  # MongoDB 7 with single-node replica set.
  # Change streams (used by all services) require a replica set.
  # ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      - TZ=Asia/Karachi
    ports:
      - "27017:27017"       # EXPOSED - Connect Compass to mongodb://localhost:27017
    volumes:
      - mongodb_data:/data/db
    networks:
      - interview-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "mongosh", "--host", "localhost", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────
  # One-shot: initialise the replica set on first boot.
  # Idempotent — safe to re-run.
  # NOTE: Disabled - your local MongoDB should already have replica set
  # ────────────────────────────────────────────────────────────────
  mongo-init:
    image: mongo:7.0
    container_name: mongo-init
    # depends_on:
    #   mongodb:
    #     condition: service_healthy
    entrypoint: >
      echo "Skipping mongo-init - using local MongoDB"
    networks:
      - interview-net
    restart: "no"
    profiles:
      - disabled  # This service won't start by default

  # ────────────────────────────────────────────────────────────────
  # Main-Agent: LLM brain.
  # Watches interviews.transcripts (speaker=candidate) → generates response.
  # Also watches interviews.interviews → inserts opening greeting.
  # ────────────────────────────────────────────────────────────────
  interview-agent:
    build:
      context: ./Main-Agent
      dockerfile: ../docker/main-agent.Dockerfile
    container_name: interview-agent
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    networks:
      - interview-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import pymongo; pymongo.MongoClient('mongodb://mongodb:27017/?directConnection=true').admin.command('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # ────────────────────────────────────────────────────────────────
  # Cleanup Service: Automatically cleans up stuck interviews.
  # Runs every 30 seconds to mark interviews as "abandoned" if:
  # - Bot heartbeat is stale (> 2 min)
  # - Interview duration exceeded (> 2 hours)
  # ────────────────────────────────────────────────────────────────
  cleanup-service:
    build:
      context: ./Cleanup-Service
      dockerfile: ../docker/cleanup-service.Dockerfile
    container_name: cleanup-service
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    networks:
      - interview-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import pymongo; pymongo.MongoClient('mongodb://mongodb:27017/?directConnection=true').admin.command('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ────────────────────────────────────────────────────────────────
  # TTS: text-to-speech.
  # Watches interviews.transcripts (speaker=agent, audio_url=null).
  # Calls ElevenLabs, plays audio through PulseAudio virtual mic
  # into the Meeting-Bot Chrome browser.
  # ────────────────────────────────────────────────────────────────
  tts:
    build:
      context: ./TTS
      dockerfile: ../docker/tts.Dockerfile
    container_name: tts
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      - VIRTUAL_MIC=virtual_mic
      - PULSE_SERVER=unix:/var/run/pulse/native
    networks:
      - interview-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import pymongo; pymongo.MongoClient('mongodb://mongodb:27017/?directConnection=true').admin.command('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ────────────────────────────────────────────────────────────────
  # Meeting-Bot orchestrator: watches MongoDB for new interviews and
  # spawns one dedicated container per interview via Docker API.
  # Each spawned container gets its own Chrome + PulseAudio + TTS.
  # ────────────────────────────────────────────────────────────────
  meeting-bot:
    build:
      context: ./Meeting-Bot
      dockerfile: ../docker/meeting-bot.Dockerfile
    image: interview-meeting-bot          # named so orchestrator can reference it
    container_name: meeting-bot
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      - MEETING_BOT_IMAGE=interview-meeting-bot
      - DOCKER_NETWORK=interview-net
    volumes:
      - meeting_bot_recordings:/app/recordings
      - /var/run/docker.sock:/var/run/docker.sock   # Docker-in-Docker for container spawning
    networks:
      - interview-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import docker; docker.from_env().ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M        # orchestrator only — no Chrome
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ────────────────────────────────────────────────────────────────
  # UI: FastAPI web form.
  # ────────────────────────────────────────────────────────────────
  ui:
    build:
      context: ./UI
      dockerfile: ../docker/ui.Dockerfile
    container_name: ui
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "8080:8080"
    networks:
      - interview-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'


# ══════════════════════════════════════════════════════════════════════
# Volumes
# ══════════════════════════════════════════════════════════════════════
volumes:
  mongodb_data:
  redis_data:        # Redis persistent data (AOF)
  meeting_bot_recordings:

# ══════════════════════════════════════════════════════════════════════
# Networks
# ══════════════════════════════════════════════════════════════════════
networks:
  interview-net:
    name: interview-net
    driver: bridge
