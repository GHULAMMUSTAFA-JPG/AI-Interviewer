events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Increase timeouts for SSE (Server-Sent Events) used by /status/{id}/stream
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Rate limiting — prevent abuse
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS main server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # UI
        location / {
            proxy_pass http://ui:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE: disable buffering so /status/{id}/stream events arrive immediately
            proxy_buffering off;
            proxy_cache off;
        }

        # Rate-limit the /start endpoint (POST creates an interview + bot container)
        location /start {
            limit_req zone=api burst=5 nodelay;
            proxy_pass http://ui:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block direct access to the Docker metrics ports from outside
        location /metrics {
            return 403;
        }
    }
}
