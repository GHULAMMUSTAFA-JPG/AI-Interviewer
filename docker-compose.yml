# ══════════════════════════════════════════════════════════════════════
# AI Interviewer — Root Compose File
#
# Starts all services from one place:
#   docker compose up --build
#
# First run only — seed interview data (after containers are up):
#   docker compose exec interview-agent python setup_db.py
#
# Secrets: copy .env.example → .env and fill in your keys before running.
#
# Flow:
#   UI form → interviews.interviews (insert)
#     ├── interview-agent (greeting watcher) → interviews.transcripts {speaker=agent}
#     │     └── tts → ElevenLabs → PulseAudio → Chrome (plays in meeting)
#     └── meeting-bot → Chrome joins meeting
#           └── caption scraper → interviews.transcripts {speaker=candidate}
#                 └── interview-agent (candidate watcher) → LLM → transcripts {speaker=agent}
#                       └── tts → plays response → loop
# ══════════════════════════════════════════════════════════════════════

services:


  # ─────────────────────────────────────────────────────────────────────────────
  # Redis 7 — Real-time state management, pub/sub, caching, and queues.
  # Used for:
  #   - Bot & meeting state management (instant status updates)
  #   - Pub/sub events (real-time notifications)
  #   - Caching (reduce MongoDB load)
  #   - Task queues (TTS, STT jobs)
  #   - Heartbeat monitoring (detect dead bots)
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    # To enable auth: set REDIS_PASSWORD in .env.docker, then change command to:
    #   redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    # and update REDIS_URI to: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      - TZ=Asia/Karachi
    ports:
      - "6379:6379"       # EXPOSED - Connect Redis CLI to localhost:6379
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - interview-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # ────────────────────────────────────────────────────────────────
  # MongoDB 7 with single-node replica set.
  # Change streams (used by all services) require a replica set.
  # ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    # Auth is enabled. Change the password below AND in .env.docker (MONGODB_URI).
    # For existing databases without auth, run scripts/enable-mongo-auth.sh first,
    # then restart this container.
    command: ["--replSet", "rs0", "--bind_ip_all", "--auth"]
    environment:
      - TZ=Asia/Karachi
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=changeme_mongo   # change this
    ports:
      - "27017:27017"       # EXPOSED - Connect Compass to mongodb://admin:changeme_mongo@localhost:27017/admin
    volumes:
      - mongodb_data:/data/db
    networks:
      - interview-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "mongosh", "--host", "localhost", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────
  # One-shot: initialise the replica set on first boot.
  # Idempotent — safe to re-run.
  # ────────────────────────────────────────────────────────────────
  mongo-init:
    image: mongo:7.0
    container_name: mongo-init
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_ROOT_PASSWORD=changeme_mongo   # must match mongodb service above
    volumes:
      - ./docker/mongo/init.sh:/init.sh:ro
    entrypoint: ["bash", "/init.sh"]
    networks:
      - interview-net
    restart: "no"

  # ────────────────────────────────────────────────────────────────
  # Main-Agent: LLM brain.
  # Watches interviews.transcripts (speaker=candidate) → generates response.
  # Also watches interviews.interviews → inserts opening greeting.
  # ────────────────────────────────────────────────────────────────
  interview-agent:
    build:
      context: ./Main-Agent
      dockerfile: ../docker/main-agent.Dockerfile
    container_name: interview-agent
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      - METRICS_PORT=9001
    ports:
      - "9001:9001"     # Prometheus metrics (internal use — remove if not needed)
    networks:
      - interview-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,pymongo; pymongo.MongoClient(os.environ['MONGODB_URI']).admin.command('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # ────────────────────────────────────────────────────────────────
  # Cleanup Service: Automatically cleans up stuck interviews.
  # Runs every 30 seconds to mark interviews as "abandoned" if:
  # - Bot heartbeat is stale (> 2 min)
  # - Interview duration exceeded (> 2 hours)
  # ────────────────────────────────────────────────────────────────
  cleanup-service:
    build:
      context: ./Cleanup-Service
      dockerfile: ../docker/cleanup-service.Dockerfile
    container_name: cleanup-service
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    networks:
      - interview-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,pymongo; pymongo.MongoClient(os.environ['MONGODB_URI']).admin.command('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ────────────────────────────────────────────────────────────────
  # TTS: text-to-speech.
  # Watches interviews.transcripts (speaker=agent, audio_url=null).
  # Calls ElevenLabs, plays audio through PulseAudio virtual mic
  # into the Meeting-Bot Chrome browser.
  # ────────────────────────────────────────────────────────────────
  tts:
    build:
      context: ./TTS
      dockerfile: ../docker/tts.Dockerfile
    container_name: tts
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      - VIRTUAL_MIC=virtual_mic
      - PULSE_SERVER=unix:/var/run/pulse/native
      - METRICS_PORT=9002
    ports:
      - "9002:9002"     # Prometheus metrics
    networks:
      - interview-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,pymongo; pymongo.MongoClient(os.environ['MONGODB_URI']).admin.command('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ────────────────────────────────────────────────────────────────
  # Meeting-Bot orchestrator: watches MongoDB for new interviews and
  # spawns one dedicated container per interview via Docker API.
  # Each spawned container gets its own Chrome + PulseAudio + TTS.
  # ────────────────────────────────────────────────────────────────
  meeting-bot:
    build:
      context: ./Meeting-Bot
      dockerfile: ../docker/meeting-bot.Dockerfile
    image: interview-meeting-bot          # named so orchestrator can reference it
    container_name: meeting-bot
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      - MEETING_BOT_IMAGE=interview-meeting-bot
      - DOCKER_NETWORK=interview-net
    volumes:
      - meeting_bot_recordings:/app/recordings
      - /var/run/docker.sock:/var/run/docker.sock   # Docker-in-Docker for container spawning
    networks:
      - interview-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import docker; docker.from_env().ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M        # orchestrator only — no Chrome
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ────────────────────────────────────────────────────────────────
  # UI: FastAPI web form.
  # ────────────────────────────────────────────────────────────────
  ui:
    build:
      context: ./UI
      dockerfile: ../docker/ui.Dockerfile
    container_name: ui
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "8080:8080"
    networks:
      - interview-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'


  # ────────────────────────────────────────────────────────────────
  # nginx: Reverse proxy + rate limiting.
  # Port 80 → UI:8080  |  Grafana is accessed directly on port 3000.
  # HTTPS: uncomment ssl block in docker/nginx/nginx.conf when cert ready.
  # ────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    depends_on:
      - ui
    ports:
      - "80:80"         # HTTP — redirects to HTTPS
      - "443:443"       # HTTPS — main entry point
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks:
      - interview-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  # ────────────────────────────────────────────────────────────────
  # Prometheus — scrapes /metrics from interview-agent and tts.
  # UI: http://localhost:9090
  # ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - interview-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ────────────────────────────────────────────────────────────────
  # Grafana — dashboards for LLM latency, TTS duration, interviews.
  # UI: http://localhost:3000  (default login: admin / admin)
  # Set GF_SECURITY_ADMIN_PASSWORD in .env.docker for a real password.
  # ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - interview-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

# ══════════════════════════════════════════════════════════════════════
# Volumes
# ══════════════════════════════════════════════════════════════════════
volumes:
  mongodb_data:
  redis_data:        # Redis persistent data (AOF)
  meeting_bot_recordings:
  prometheus_data:   # Prometheus TSDB — 30-day retention
  grafana_data:      # Grafana dashboards, users, alert state

# ══════════════════════════════════════════════════════════════════════
# Networks
# ══════════════════════════════════════════════════════════════════════
networks:
  interview-net:
    name: interview-net
    driver: bridge
