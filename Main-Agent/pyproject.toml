[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "main-agent"
version = "0.1.0"
description = "AI Interview Agent with Gemini Flash 2.5"
readme = "README.md"
requires-python = ">=3.13"

[tool.hatch.build.targets.wheel]
packages = ["src"]
dependencies = [
    "google-generativeai>=0.8.0",
    "motor>=3.6.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "black>=24.0.0",
    "pytest-mock>=3.12.0",
]
tts = [
    "aiohttp>=3.10.0",  # Only needed if you have a TTS service
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
